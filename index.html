
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table des Matières - CFA Interpro</title>
    <style>
        :root {
            --primary: #0f172a; 
            --secondary: #3b82f6; 
            --accent: #f59e0b; 
            --light: #f8fafc;
            --dark: #020617;
        }

        * { box-sizing: border-box; font-family: 'Comic Sans MS', sans-serif; }
        body { background-color: #e2e8f0; color: var(--dark); padding: 20px; display: flex; justify-content: center; }
        
        .app-container { 
            width: 100%; 
            max-width: 900px; 
            background: white; 
            border: 4px solid var(--dark); 
            border-radius: 20px; 
            box-shadow: 8px 8px 0 var(--dark); 
            overflow: hidden; 
        }

        header { 
            background: var(--primary); 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom: 4px solid var(--dark); 
        }
        
        header h1 { color: white; text-shadow: 2px 2px 0 var(--secondary); margin: 0; font-size: 2.5em; text-transform: uppercase; }
        header p { color: #cbd5e1; font-size: 1.2em; margin-top: 10px; font-weight: bold; }

        .content-section { padding: 40px; }
        
        h2 { color: var(--secondary); font-size: 1.8em; text-align: center; margin-bottom: 30px; border-bottom: 3px dashed var(--secondary); padding-bottom: 10px; }

        .grid-menu { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
        }

        .menu-card {
            display: flex;
            align-items: center;
            background: var(--light);
            border: 3px solid var(--dark);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: var(--dark);
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0 var(--dark);
        }

        .menu-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--secondary);
            background: #eff6ff;
        }

        .menu-card:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 var(--dark);
        }

        .icon-container {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: 2px solid var(--dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.2em;
            flex-shrink: 0;
        }
        
        .footer-logo {
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Plan de Vol Financier 🛩️</h1>
        <p>— Table des Matières AMLHR —</p>
    </header>

    <div class="content-section">
        <h2>Sélectionnez votre module</h2>
        
        <div class="grid-menu">
            <a href="1 intro.html" class="menu-card">
                <div class="icon-container">1</div>
                Introduction
            </a>
            <a href="2 Le bilan.html" class="menu-card">
                <div class="icon-container">2</div>
                Le Bilan
            </a>
            <a href="3 Le bilan fonctionnel.html" class="menu-card">
                <div class="icon-container">3</div>
                Le Bilan Fonctionnel
            </a>
            <a href="4 Le compte de résultat.html" class="menu-card">
                <div class="icon-container">4</div>
                Le Compte de Résultat
            </a>
            <a href="5 Les SIG.html" class="menu-card">
                <div class="icon-container">5</div>
                Les SIG
            </a>
            <a href="6 La CAF.html" class="menu-card">
                <div class="icon-container">6</div>
                La CAF
            </a>
            <a href="7 Le pilotage des flux financier.html" class="menu-card">
                <div class="icon-container">7</div>
                Le Pilotage des Flux Financiers
            </a>
            <a href="8 Le financement des investissements.html" class="menu-card">
                <div class="icon-container">8</div>
                Le Financement des Investissements
            </a>
        </div>
        
        <div class="footer-logo">
            <svg width="80" height="80" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
                <path d="M 30 50 L 70 50 M 50 30 L 50 70" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="10" fill="#3b82f6" stroke="#0f172a" stroke-width="3"/>
            </svg>
        </div>
    </div>
</div>
<style>
    /* Effet Machine à écrire sur les titres des missions */
    .scenario-box h3 {
        display: inline-block;
        overflow: hidden;
        border-right: .15em solid var(--primary);
        white-space: nowrap;
        margin: 0;
        animation: typing 2.5s steps(40, end), blink-caret .75s step-end infinite;
    }
    
    /* Adaptabilité pour les petits écrans (Pixel 9, etc.) */
    @media (max-width: 600px) {
        .scenario-box h3 { white-space: normal; border-right: none; animation: none; }
    }

    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--primary); } }
</style>

<script>
    // Synthétiseur sonore certifié (génère un "Bip" doux sans fichier audio externe)
    function playBip() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'triangle'; // Son doux et agréable
            osc.frequency.setValueAtTime(600, ctx.currentTime); 
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
            osc.stop(ctx.currentTime + 0.3);
        } catch(e) {
            console.log("Audio non supporté");
        }
    }

    // Activation du son sur TOUS les boutons et liens de navigation de l'application
    document.querySelectorAll('button, .nav-btn, .item-to-sort, .item-btn, .menu-card').forEach(btn => {
        btn.addEventListener('click', playBip);
    });
</script>
</body>
</html>
